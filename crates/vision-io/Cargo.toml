[package]
name = "vision-io"
version.workspace = true
edition.workspace = true

[dependencies]
vision-core.workspace = true

# Video-file decoding (ROADMAP §1 "Record & replay" / external-camera input).
# Bindings to the system FFmpeg 6.1 libav* libraries. Default features are off
# and only `codec` + `format` are enabled on purpose: this machine ships the dev
# packages for libavcodec/libavformat/libavutil but NOT libswscale/libavfilter/
# libavdevice, so pulling in the default feature set would fail to build. We do
# the YUV->RGB conversion ourselves (vision_core::yuv_to_rgb) instead of leaning
# on swscale, which keeps the dependency surface to just those three libs.
ffmpeg-next = { version = "6.1", default-features = false, features = ["codec", "format"] }
