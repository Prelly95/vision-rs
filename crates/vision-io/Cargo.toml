[package]
name = "vision-io"
version.workspace = true
edition.workspace = true

[dependencies]
vision-core.workspace = true

# Video-file decoding (ROADMAP §1 "Record & replay" / external-camera input).
# Bindings to the system FFmpeg libav* libraries. Default features are off; only
# what we use is enabled: `codec` + `format` for demux/decode, `software-scaling`
# (libswscale) to convert any decoded pixel format to RGB24.
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }

# PNG decoding for image-sequence datasets (image I/O is plumbing, not research).
png = "0.17"
